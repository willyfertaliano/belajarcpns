name: Build APK Belajar CPNS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project ZIP
        run: |
          mkdir project
          unzip -q BelajarCPNS_v2.0_GitHub_Actions.zip -d project

      - name: Find project folder
        run: |
          echo "Isi project:"
          find project -maxdepth 3 -type f | head -100

      - name: Build APK
        working-directory: project
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BelajarCPNS-debug
          path: project/app/build/outputs/apk/debug/app-debug.apk
